<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Course — OceanCrest AI</title>
<meta name="description" content="An OceanCrest AI course: what it covers, who it is for, and where it sits in the two-track library.">
<link rel="icon" href="assets/img/logos/oceancrest-ai-mark-primary-rgb-fullcolor.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/courses.js"></script>
<script src="assets/js/cards.js"></script>
<script src="assets/js/coast.js"></script>
<script src="assets/js/sea.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/contours.js"></script>
<!--
  SINGLE COURSE PAGE. One template for every course: course.html?id=<course id>. Unknown ids fall back
  to ai-c-suite. Ported from the learning-site prototype (public view only).
  Length, outcomes and lesson titles are [placeholders] until each course is written.
  Mindset titles marked draft in courses.js are working titles and carry a PA mark.
-->
<style>
.course-hero{padding-top:20px}
.course-art{height:clamp(200px,24vw,300px);border-radius:var(--r-lg);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;margin-bottom:clamp(28px,3vw,40px)}
.course-art .tag,.course-art .half{background:var(--paper)}
.course-art .tag{position:relative}
.course-art .title-block{right:20px;bottom:18px;top:auto}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px clamp(32px,5vw,64px);align-items:end}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.crumbs a{border-bottom:1px solid var(--line);transition:border-color .2s}
.crumbs a:hover{border-color:var(--blue)}
.crumbs span[aria-hidden]{color:var(--silver)}
.course-hero .h1{margin:16px 0 18px}
.course-hero .lede{max-width:620px}
.course-hero .btns{margin-top:28px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.facts>div{padding:18px 20px;border-top:1px dashed var(--line)}
.facts>div:nth-child(-n+2){border-top:0}
.facts>div:nth-child(odd){border-right:1px dashed var(--line)}
.facts b{display:block;font-family:var(--display);font-weight:500;font-size:18px;color:var(--navy);margin-top:6px}
.course-body{display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,56px);padding-block:clamp(40px,5vw,64px) clamp(56px,7vw,88px)}
.main-col{flex:999 1 520px;min-width:0}
.side-col{flex:1 1 280px;display:flex;flex-direction:column;gap:16px}
.main-col h2{font-size:clamp(24px,2.4vw,30px);font-weight:500;letter-spacing:-.01em;margin-bottom:14px}
.main-col .ticks{margin-bottom:clamp(36px,4vw,48px)}
.main-col .ticks li{color:var(--slate)}
.syllabus{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.syllabus li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:16px 20px;border-top:1px solid var(--line);transition:background .2s}
.syllabus li:first-child{border-top:0}
.syllabus li:hover{background:var(--t-tint)}
.c-mindset .syllabus li:hover{background:var(--e-tint)}
.syllabus .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.syllabus .t{font-size:16px;color:var(--navy)}
.syllabus .t small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.syllabus .d{font-family:var(--mono);font-size:12px;color:var(--slate);white-space:nowrap}
.syllabus li.task{background:rgba(253,233,184,.35)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--paper)}
.box p{margin-top:10px;font-size:14px;color:var(--ink)}
.box.start{background:var(--t-tint);border-color:transparent}
.c-mindset .box.start{background:var(--e-tint)}
.box .lead{display:flex;gap:12px;align-items:center;margin-top:14px}
.box .lead img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.box .lead b{display:block;font-weight:500;font-size:15px}
.box .lead span{display:block;font-size:13px;color:var(--slate)}
.draft{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:16px 20px;border-radius:var(--r);background:rgba(253,233,184,.45);margin-bottom:clamp(28px,3vw,40px)}
.draft p{flex:1 1 260px;font-size:15px;color:var(--navy)}
.related{padding-bottom:clamp(56px,7vw,88px)}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:18px}
.sec-h h2{font-size:clamp(24px,2.4vw,30px);font-weight:500;letter-spacing:-.01em}

/* Live-site chart furniture. Shared .has-contours>* sets position:relative at higher specificity,
   so absolutely placed furniture is restated here. */
.has-contours>.tick:not(.contours):not(.coast-layer),.has-contours>.title-block:not(.contours):not(.coast-layer),.has-contours>.course-lane:not(.contours):not(.coast-layer){position:absolute}
.has-contours>.tick:not(.contours):not(.coast-layer){z-index:2}
@media (max-width:900px){.course-art .title-block{display:none}}
.final{min-height:380px}
.final .btn:not(.primary){background:var(--paper)}
</style>
</head>
<body data-page="courses">
<main id="main"></main>

<script>
(function () {
  var E = window.esc;
  var ARR = '<span class="arr" aria-hidden="true">&rarr;</span>';
  var params = new URLSearchParams(location.search);
  var c = courseById(params.get("id")) || courseById("ai-c-suite");
  var cat = categoryById(c.category), tr = TRACKS[c.track];
  var isTemplate = c.type === "template", mind = c.track === "mindset";
  document.title = c.title + " — OceanCrest AI";
  document.body.classList.add("c-" + c.track);

  var format = isTemplate ? "Download + prompts" : mind ? "Reading + reflection" : "Video + hands-on practice";
  var firstCourse = courseById(mind ? "m-without-fear" : "ai-fundamentals");
  var outline = isTemplate
    ? ["The template file", "A prompt for every slide", "Example: a finished deck", "How to adapt it to your business"]
    : ["[Lesson title]", "[Lesson title]", "[Lesson title]", "[Lesson title]", "[Lesson title]"];
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  var related = COURSES.filter(function (x) { return x.category === c.category && x.id !== c.id; });
  if (related.length < 3) related = related.concat(COURSES.filter(function (x) { return x.track === c.track && x.category !== c.category && x.id !== c.id; }));
  related = related.slice(0, 3);
  var bearing = 160 + (c.id.length * 7) % 24;

  var html =
    '<section class="course-hero"><div class="wrap">' +
      '<div class="course-art coast has-contours" data-coast="' + E(c.id) + '" data-palette="' + c.track + '" data-size="wide" data-scene="' + (mind ? "beach" : "headland") + '" data-glints>' +
        '<canvas class="contours" data-contours="white" aria-hidden="true"></canvas>' +
        '<i class="tick tick-tl" aria-hidden="true"></i><i class="tick tick-tr" aria-hidden="true"></i><i class="tick tick-bl" aria-hidden="true"></i><i class="tick tick-br" aria-hidden="true"></i>' +
        '<span class="tag cat-' + E(c.category) + '">' + E(cat.name) + '</span>' +
        '<span class="half' + (mind ? " e" : "") + '">' + E(tr.name) + '</span>' +
        '<div class="title-block" aria-hidden="true"><p>OceanCrest AI · Learning</p><p>Chart OC-02d — ' + E(cat.name) + '</p><p>Course ' + E(c.id) + ' · Corrected 2026</p></div>' +
      '</div>' +
      '<div class="ch-grid"><div>' +
        '<nav class="ref crumbs" aria-label="Breadcrumb"><a href="courses.html">Courses</a><span aria-hidden="true">/</span><a href="courses.html?track=' + c.track + '">' + E(tr.name) + '</a><span aria-hidden="true">/</span><a href="courses.html?cat=' + E(c.category) + '">' + E(cat.name) + '</a></nav>' +
        '<h1 class="h1">' + E(c.title) + (c.draft ? '<span class="pa">PA</span>' : "") + '</h1>' +
        '<p class="lede">' + E(c.blurb) + '</p>' +
        '<div class="btns"><a class="btn primary" href="diagnostic.html">Take the diagnostic ' + ARR + '</a><a class="btn" href="book.html?about=learning">Book a call to get access</a></div>' +
      '</div>' +
      '<div class="facts">' +
        '<div><span class="ref">Level</span><b>' + E(c.level) + '</b></div>' +
        '<div><span class="ref">Length</span><b>' + (isTemplate ? "Self-serve" : "[X] lessons · [X] hrs") + '</b></div>' +
        '<div><span class="ref">Format</span><b>' + format + '</b></div>' +
        '<div><span class="ref">Track</span><b>' + E(tr.name) + '</b></div>' +
      '</div></div>' +
    '</div></section>' +

    '<section class="lane-host"><div class="course-lane" aria-hidden="true" style="top:clamp(40px,5vw,64px)"><span class="course-waypoint"></span><span class="course-rule"></span><span class="course-bearing">CO ' + bearing + '°</span></div>' +
    '<div class="wrap course-body">' +
      '<div class="main-col">' +
        (c.draft ? '<div class="draft"><span class="tag line">Working title</span><p>PA — position approximate: the title is a working title. The mindset team is still shaping this course.</p></div>' : "") +
        '<h2>' + (isTemplate ? "What you get." : "What you will be able to do.") + '</h2>' +
        '<ul class="ticks"><li><span>[Outcome 1: a specific thing the learner can do after this course]</span></li><li><span>[Outcome 2]</span></li><li><span>[Outcome 3]</span></li></ul>' +
        '<h2>' + (isTemplate ? "What is inside." : "Course outline.") + '</h2>' +
        '<ol class="syllabus">' + outline.map(function (t, i) {
          return '<li><span class="n">' + pad(i + 1) + '</span><span class="t">' + E(t) + (isTemplate ? "" : "<small>[One-line summary]</small>") + '</span><span class="d">' + (isTemplate ? "" : "[X] min") + '</span></li>';
        }).join("") +
        (isTemplate ? "" : '<li class="task"><span class="n">' + pad(outline.length + 1) + '</span><span class="t">' + (mind ? "Team discussion and reflection" : "Course task: build it for your job") +
          '<small>' + (mind ? "Bring what you learned to your next team meeting." : "Apply the course to a real task and save the result to your playbook.") + '</small></span><span class="d">[X] min</span></li>') +
        '</ol>' +
      '</div>' +
      '<aside class="side-col" aria-label="About this course">' +
        (c.prereq
          ? '<div class="box start"><span class="eyebrow">Start here</span><p>This is the first course in the ' + E(tr.name.toLowerCase()) + ' track. Everything else builds on it.</p></div>'
          : firstCourse ? '<div class="box"><span class="eyebrow">Before you start</span><p>Take <a class="link" href="course.html?id=' + firstCourse.id + '">' + E(firstCourse.title) + '</a> first if you have not already. Or take the diagnostic, and we will tell you where to start.</p></div>' : "") +
        '<div class="box"><span class="eyebrow">Track lead</span><div class="lead"><img src="' + tr.photo + '" alt="' + E(tr.lead) + '" loading="lazy"><div><b>' + E(tr.lead) + '</b><span>' + E(tr.leadTitle) + '</span></div></div></div>' +
        '<div class="box"><span class="eyebrow">Ends with</span><p>' + (isTemplate ? "A finished file of your own, adapted to your business." : mind ? "A reflection only you and your manager see, plus a question for your team." : "Something you built for your own job, saved to your playbook.") + '</p></div>' +
        '<div class="box"><span class="eyebrow">Access</span><p>Part of the membership: a seat unlocks every course. <a class="link" href="education.html#membership">What membership includes</a></p></div>' +
      '</aside>' +
    '</div></section>' +

    (related.length ? '<section class="wrap related"><div class="sec-h"><h2>More in ' + E(cat.name.toLowerCase()) + '.</h2><a class="link" href="courses.html?cat=' + E(c.category) + '">See all</a></div><div class="cards">' +
      related.map(function (r) { return courseCard(r); }).join("") + '</div></section>' : "") +

    '<div class="wrap"><div class="notch" aria-hidden="true"><svg viewBox="0 0 1200 28" preserveAspectRatio="none"><path d="M0 10 H452 L480 18 H1200" fill="none" stroke="#b3b8bf" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><i></i></div></div>' +

    '<section class="section" style="padding-top:clamp(40px,5vw,64px)"><div class="wrap">' +
      '<div class="final coast has-contours" data-coast="course-final-' + E(c.track) + '" data-palette="dusk" data-size="wide" data-scene="cove" data-glints>' +
        '<canvas class="contours" data-contours="white" aria-hidden="true"></canvas>' +
        '<div class="eyebrow" style="color:var(--deep)">Not sure this is the one</div>' +
        '<h2 class="h2" style="margin-top:14px">Find out what you know before we <span class="stroke warm">teach</span> it.</h2>' +
        '<p class="lede">Fifteen short questions, about five minutes. You get a level, a score in each area, and the courses that close your gaps.</p>' +
        '<div class="btns"><a class="btn primary" href="diagnostic.html" data-sound="chime" data-sparkle>Take the diagnostic ' + ARR + '</a><a class="btn" href="courses.html">See every course</a></div>' +
      '</div></div></section>';

  document.getElementById("main").innerHTML = html;
})();
</script>
</body>
</html>
